# tmux defaults tuned for a reattach-from-anywhere remote dev box.

# Mouse on = scroll + pane select with a finger on mobile.
set -g mouse on

# Deep scrollback so you don't lose build output between reconnects.
set -g history-limit 50000

# 1-indexed windows/panes are easier to hit on a phone keyboard.
set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"

# Never auto-destroy a session just because no client is attached.
set -g destroy-unattached off

# Renumber windows when one closes so the list stays tidy.
set -g renumber-windows on

# Faster escape (nicer in editors over the terminal).
set -sg escape-time 10

# Simple, readable status bar.
set -g status-style "bg=colour234,fg=colour250"
set -g status-left "#[bold] #S "
set -g status-right "#[fg=colour245] %H:%M "
