# Devbox sshd — key-only direct access into the code-server container.
# Reached via the container port mapping 2222:22 on the host.
Port 22
HostKey /home/coder/.ssh/host_keys/ssh_host_ed25519_key
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers coder
X11Forwarding no

# Exempt loopback from OpenSSH 10's PerSourcePenalties. verify and the installer readiness
# probe both check SSH with an unauthenticated `ssh-keyscan 127.0.0.1` from inside the
# container; each such connection earns a `noauth` penalty under the default policy, so a
# run of quick keyscans (an agent retrying verify until green) makes sshd refuse 127.0.0.1
# and verify's service.ssh flap to fail / ok:false until the penalty expires. Loopback
# sources inside the container are local processes only; external clients arrive via the
# bridge, so brute-force protection for real remote sources is unchanged.
PerSourcePenaltyExemptList 127.0.0.1,::1
