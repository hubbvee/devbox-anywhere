# Devbox Anywhere — plain Docker alternative (no Coolify).
# Use this if you'd rather run the devbox directly with docker compose and put your own
# reverse proxy (Caddy, Traefik, nginx) in front for HTTPS. With Coolify you don't need
# this file — Coolify builds from stack/Dockerfile and handles TLS for you (see docs/02).
#
# `scripts/install-devbox` automates this file. For manual use, first create the host
# data dirs owned by uid/gid 1000 (the `coder` user):
#   sudo mkdir -p /data/devbox/{project,dot-local,claude,codex,ssh}
#   sudo chown -R 1000:1000 /data/devbox

services:
  devbox:
    build: .
    container_name: devbox
    restart: unless-stopped
    environment:
      # Web login password for code-server. Put a long random one here or in an .env file.
      - PASSWORD=${DEVBOX_PASSWORD:?set DEVBOX_PASSWORD in .env}
    ports:
      - "${DEVBOX_WEB_BIND:-127.0.0.1}:8080:8080" # keep loopback-only; proxy adds HTTPS
      - "${DEVBOX_SSH_BIND:-127.0.0.1}:2222:22"   # opt in explicitly before public exposure
    volumes:
      # HOST BIND MOUNTS, not named volumes. Named volumes are keyed to the app instance
      # and silently start empty after a delete+recreate; fixed host paths survive
      # redeploys, reboots, AND full rebuilds. See docs/03 and docs/09.
      - ${DEVBOX_DATA_ROOT:-/data/devbox}/project:/home/coder/project
      - ${DEVBOX_DATA_ROOT:-/data/devbox}/dot-local:/home/coder/.local
      - ${DEVBOX_DATA_ROOT:-/data/devbox}/claude:/home/coder/.claude
      - ${DEVBOX_DATA_ROOT:-/data/devbox}/codex:/home/coder/.codex
      - ${DEVBOX_DATA_ROOT:-/data/devbox}/ssh:/home/coder/.ssh

  # Opt-in interactive GUI browser for auth flows (Cloudflare/GitHub SSO, one-time
  # cookies). OFF BY DEFAULT: only started when the "browser" profile is selected, e.g.
  # `install-devbox --with-browser`. Reach it via noVNC in your own browser, over the
  # existing SSH tunnel or an authenticated proxy. See docs/12. Image pinned by digest.
  browser:
    profiles:
      - browser
    image: linuxserver/chromium@sha256:4c7b9086d2e5054b61c9e6b0f75efceece5befeff2bec3ff543d52e000cee21d
    container_name: devbox-browser
    restart: unless-stopped
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      # noVNC web password. Generated owner-only by install-devbox; never a literal here.
      - PASSWORD=${DEVBOX_BROWSER_PASSWORD:?set DEVBOX_BROWSER_PASSWORD in .env}
      - PUID=1000
      - PGID=1000
    ports:
      - "${DEVBOX_BROWSER_BIND:-127.0.0.1}:8081:3000" # loopback-only; never expose publicly (KasmVNC HTTP=3000)
    volumes:
      # Persist the browser profile (cookies/sessions) so completed logins survive rebuilds.
      - ${DEVBOX_DATA_ROOT:-/data/devbox}/browser:/config
